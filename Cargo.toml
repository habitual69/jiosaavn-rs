[package]
name = "jiosaavn"
version = "1.0.0"
edition = "2021"
description = "High-performance JioSaavn music downloader"
authors = ["habitual69"]

[[bin]]
name = "jiosaavn"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1",    features = ["full"] }
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
clap        = { version = "4",    features = ["derive"] }
indicatif   = "0.17"
console     = "0.15"
regex       = "1"
id3         = "1"
mp4ameta    = "0.13"
anyhow      = "1"
futures     = "0.3"
dirs        = "5"
sanitize-filename = "0.5"
once_cell   = "1"
tokio-util  = { version = "0.7", features = ["io"] }

[build-dependencies]
# Embeds jsd.ico into the Windows PE header so the .exe shows the icon in Explorer
winres = "0.1"

[profile.release]
opt-level       = 3
lto             = true
codegen-units   = 1
strip           = true
